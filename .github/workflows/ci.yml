name: CI

on:
  push:
    branches: [main, build/provider-neutral-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
