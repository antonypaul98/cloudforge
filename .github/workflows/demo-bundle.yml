name: Bounded demo bundle

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudforge-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Package and independently smoke extracted demo
        run: python scripts/package_demo.py --output-dir dist
      - name: Publish versioned, checksummed demo
        uses: actions/upload-artifact@v4
        with:
          name: cloudforge-review-demo-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
